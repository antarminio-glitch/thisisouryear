# Netlify reads this file to know how to build and serve the site.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Local testing with "npm run dev:checkout".
# "--ignore-lock" keeps the Astro server in the foreground so Netlify can wrap it.
[dev]
  command = "npx astro dev --ignore-lock"
  targetPort = 4321

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Fonts and built assets never change once published, so browsers can keep them.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
